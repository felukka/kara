name: CI/Main
on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
concurrency:
  group: build-main
  cancel-in-progress: true
jobs:
  docker:
    name: CI / Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Nix
        uses: DeterminateSystems/determinate-nix-action@v3.24.2
      - name: Build Image
        id: image
        run: |
          nix build .#docker
          load_output=$(docker load -i result)
          echo "$load_output"
          image_ref=$(echo "$load_output" | sed -n 's/Loaded image: //p')
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kara:main
        run: |-
          docker tag "${{ steps.image.outputs.ref }}" "$IMAGE"
          docker push "$IMAGE"
